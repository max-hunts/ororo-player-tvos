name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SwiftLint
        run: command -v swiftlint || brew install swiftlint
      - name: Lint
        run: swiftlint lint --strict

  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pick a tvOS simulator
        id: sim
        run: |
          udid=$(xcrun simctl list devices available --json \
            | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for k,v in d.items() if "tvOS" in k for x in v))')
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Build app
        run: |
          xcodebuild build \
            -workspace Ororo-Player.xcworkspace \
            -scheme Ororo-Player-tvOS \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO

      - name: Unit tests
        run: |
          xcodebuild test \
            -workspace Ororo-Player.xcworkspace \
            -scheme Ororo-KitTests \
            -destination "id=${{ steps.sim.outputs.udid }}"
